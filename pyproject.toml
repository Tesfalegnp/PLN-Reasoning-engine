[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-pln-metta"
version = "1.0.0"
description = "Domain-Specific Agricultural Probabilistic Logic Network (PLN) Reasoning Engine implemented in Hyperon MeTTa"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Agricultural PLN Team" }
]
dependencies = [
    "hyperon>=0.2.10"
]

[project.scripts]
agri-pln = "cli:main"
